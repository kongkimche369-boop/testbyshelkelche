<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Narrate - PDF to Audio</title>
    <style>
        @import url('https://googleapis.com');
        body {
            background-color: #0a0a0f;
            color: #f0f0f8;
            font-family: 'DM Sans', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .app-container {
            background: #111118;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
            max-width: 500px;
            width: 100%;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.08);
        }
        .app-title {
            font-family: 'DM Serif Display', serif;
            font-size: 2.8rem;
            color: #a78bfa;
            margin: 0 0 10px 0;
        }
        .subtitle {
            color: #9090a8;
            margin-bottom: 30px;
        }
        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #a78bfa;
            font-weight: bold;
            font-size: 0.9rem;
        }
        input[type="password"] {
            width: 100%;
            padding: 12px;
            background: #0a0a0f;
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 8px;
            color: white;
            box-sizing: border-box;
        }
        .upload-box {
            border: 2px dashed rgba(167,139,250,0.3);
            padding: 50px 20px;
            border-radius: 12px;
            background: #0a0a0f;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 25px;
        }
        .upload-box:hover {
            border-color: #818cf8;
            background: #14141f;
        }
        .btn-primary {
            background: #a78bfa;
            color: #0a0a0f;
            border: none;
            padding: 14px 28px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            font-size: 1rem;
            transition: background 0.2s;
        }
        .btn-primary:hover {
            background: #818cf8;
        }
        .btn-primary:disabled {
            background: #4a4a5a;
            color: #808090;
            cursor: not-allowed;
        }
        #status {
            margin-top: 20px;
            color: #cbd5e1;
            font-size: 0.9rem;
            line-height: 1.4;
        }
    </style>
    <script src="https://cloudflare.com"></script>
</head>
<body>

<div class="app-container">
    <h1 class="app-title">Narrate</h1>
    <p class="subtitle">Convert PDF files into downloadable MP3 audio</p>
    
    <div class="input-group">
        <label for="api-key">Your OpenAI API Key</label>
        <input type="password" id="api-key" placeholder="Paste your sk-... key here">
    </div>
    
    <div class="upload-box" onclick="document.getElementById('pdf-upload').click()">
        <p id="upload-text" style="color: #9090a8; margin: 0; font-size: 1.1rem;">📂 Drag & drop your PDF file here or click to browse</p>
        <input type="file" id="pdf-upload" accept=".pdf" style="display: none;">
    </div>
    
    <button class="btn-primary" id="process-btn" disabled>⚡ Generate & Download MP3</button>
    <div id="status">Enter your API key and select a PDF file to begin.</div>
</div>

<script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cloudflare.com';

    let extractedText = "";
    const fileInput = document.getElementById('pdf-upload');
    const uploadText = document.getElementById('upload-text');
    const processBtn = document.getElementById('process-btn');
    const statusDiv = document.getElementById('status');
    const apiKeyInput = document.getElementById('api-key');

    fileInput.addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        
        uploadText.innerText = `📄 ${file.name}`;
        statusDiv.innerText = "Extracting text from PDF...";
        processBtn.disabled = true;

        try {
            const arrayBuffer = await file.arrayBuffer();
            const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
            let fullText = "";

            for (let i = 1; i <= pdf.numPages; i++) {
                const page = await pdf.getPage(i);
                const textContent = await page.getTextContent();
                const pageText = textContent.items.map(item => item.str).join(" ");
                fullText += pageText + " ";
            }

            extractedText = fullText.trim();
            if (extractedText.length === 0) {
                statusDiv.innerText = "❌ Could not read any text inside this PDF.";
            } else {
                statusDiv.innerText = `✅ PDF loaded successfully. Ready to convert!`;
                processBtn.disabled = false;
            }
        } catch (err) {
            statusDiv.innerText = "❌ Error reading PDF data: " + err.message;
        }
    });

    processBtn.addEventListener('click', async () => {
        const apiKey = apiKeyInput.value.trim();
        if (!apiKey) {
            alert("Please paste your OpenAI API key into the input box first!");
            return;
        }

        statusDiv.innerText = "⏳ Processing voice track with OpenAI (This may take a moment)...";
        processBtn.disabled = true;

        try {
            const textToSpeak = extractedText.substring(0, 4000); 

            const response = await fetch('https://openai.com', {
                method: 'POST',
                headers: {
                    'Authorization': `Bearer ${apiKey}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    model: 'tts-1',
                    input: textToSpeak,
                    voice: 'alloy'
                })
            });

            if (!response.ok) {
                const errData = await response.json();
                throw new Error(errData.error?.message || "Voice system connection failed.");
            }

            statusDiv.innerText = "🎉 Audio ready! Starting your MP3 download now...";
            const blob = await response.blob();
            const url = window.URL.createObjectURL(blob);
            
            const a = document.createElement('a');
            a.href = url;
            a.download = 'downloaded-audio-book.mp3';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            
            statusDiv.innerText = "✨ Success! Check your browser's download folder.";
            processBtn.disabled = false;
        } catch (err) {
            statusDiv.innerText = "❌ Pipeline error: " + err.message;
            processBtn.disabled = false;
        }
    });
</script>

</body>
</html>
